name: http-tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    # These are live integration tests that need a beacon node HTTP endpoint.
    # Skip cleanly when it is not configured; runs automatically once it is.
    if: vars.HTTP_ADDRESS != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'

      - name: Run HTTP tests
        env:
          HTTP_ADDRESS: ${{ vars.HTTP_ADDRESS }}
          HTTP_TEST_CONCURRENCY: ${{ vars.HTTP_TEST_CONCURRENCY }}
          HTTP_BEARER_TOKEN: ${{ secrets.HTTP_BEARER_TOKEN }}
        run: go test -v -timeout=10m ./http/...
